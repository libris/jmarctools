plugins {
    id 'java'
}

group = 'se.kb.libris'
version = '1.3.7'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:unchecked' << '-Xlint:deprecation'
}

def isoArgs = ['-inType=ISO2709', '-inEncoding=UTF-8', '-outEncoding=UTF-8', '-trustLength=false', '-trustDirectory=false']

tasks.register('in_out', JavaExec) {
    standardInput = System.in
    mainClass = 'se.kb.libris.util.marc.io.InOut'
    classpath = sourceSets.main.runtimeClasspath
    args(isoArgs + ['-outType=ISO2709'])
}

tasks.register('iso_to_text', JavaExec) {
    standardInput = System.in
    mainClass = 'se.kb.libris.util.marc.io.InOut'
    classpath = sourceSets.main.runtimeClasspath
    args(isoArgs + ['-outType=TEXT'])
}
